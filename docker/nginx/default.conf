server {
    listen 80;

    # nginx's own compiled-in default (1m) rejects the request body before
    # it ever reaches PHP-FPM, independent of PHP's own upload_max_filesize/
    # post_max_size (see docker/backend/uploads.ini) or Laravel's validation.
    # Matches post_max_size so nginx is never the tightest layer in the
    # stack — ToolRequest's max:4096 (4MB) rule should be the binding limit.
    client_max_body_size 10m;

    # Laravel API, served via PHP-FPM over FastCGI.
    location /api/ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Sanctum's CSRF cookie route is registered at the root path by the
    # package itself, not under /api/, so it needs its own location block.
    location /sanctum/ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Uploaded tool images (Laravel's public disk). Served directly as static
    # files rather than proxied to PHP-FPM, since nginx runs in its own
    # container and this is just a read-only mount of storage/app/public —
    # there's no Laravel route for /storage/*, that's normally handled by the
    # public/storage symlink, which doesn't help here since nginx can't see
    # the backend container's filesystem.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
    }

    # Next.js dev server. Upgrade headers are required for its
    # hot-reload websocket to survive being proxied.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
